<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0b12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>The Tower</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --gold: #f2d38a;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #0d0b12; color: #f4ecd8;
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
        user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
      }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #top {
        position: absolute; top: calc(10px + var(--sat)); left: calc(12px + var(--sal));
        right: calc(12px + var(--sar)); display: flex; align-items: flex-start; gap: 12px;
      }
      .bar {
        position: relative; height: 18px; border-radius: 9px; background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.25); overflow: hidden;
      }
      #hpbar { width: min(42vw, 260px); }
      #hpfill { height: 100%; width: 100%; background: linear-gradient(#ff6b6b, #c22f3d); transition: width 0.15s; }
      #hptext {
        position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 17px;
        font-weight: 700; text-shadow: 0 1px 2px #000;
      }
      #items { margin-top: 6px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 46vw; }
      #items span { background: rgba(0, 0, 0, 0.45); border-radius: 6px; padding: 1px 6px; }
      #floor {
        margin-left: auto; text-align: right; font-weight: 800; font-size: 16px; color: var(--gold);
        text-shadow: 0 1px 3px #000;
      }
      #floor small { display: block; font-weight: 600; font-size: 12px; color: #d8cfc0; }
      #boss {
        position: absolute; top: calc(58px + var(--sat)); left: 50%; transform: translateX(-50%);
        width: min(70vw, 460px); text-align: center; display: none;
      }
      #bossname { font-weight: 800; color: #ffb3a1; text-shadow: 0 1px 3px #000; margin-bottom: 3px; }
      #bossfill { height: 100%; width: 100%; background: linear-gradient(#e2562f, #7d1616); transition: width 0.15s; }
      #toast {
        position: absolute; top: 24%; left: 50%; transform: translateX(-50%); max-width: 86vw;
        padding: 8px 16px; border-radius: 10px; background: rgba(12, 10, 18, 0.8);
        border: 1px solid rgba(242, 211, 138, 0.5); font-weight: 700; text-align: center;
        opacity: 0; transition: opacity 0.25s;
      }
      #toast.show { opacity: 1; }
      #dmg span {
        position: absolute; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 1px 3px #000;
        transform: translate(-50%, -50%); animation: rise 0.7s ease-out forwards; white-space: nowrap;
      }
      #dmg span.crit { color: #ffd84a; font-size: 24px; }
      #dmg span.hurt { color: #ff6b6b; }
      #dmg span.heal { color: #7dffa0; }
      @keyframes rise { to { transform: translate(-50%, -190%); opacity: 0; } }
      #hurt {
        position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s;
        background: radial-gradient(transparent 55%, rgba(200, 20, 30, 0.55));
      }
      #stick {
        position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.25); display: none;
      }
      #knob {
        position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
        border-radius: 50%; background: rgba(255, 255, 255, 0.4);
      }
      .btn {
        -webkit-touch-callout: none;
        position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4);
        background: rgba(20, 16, 28, 0.55); color: #fff; font-weight: 800; touch-action: none;
        display: flex; align-items: center; justify-content: center; padding: 0;
      }
      .btn.down { background: rgba(242, 211, 138, 0.45); }
      /* 크기·투명도·위치는 설정창에서 바꾼다 (--btn-scale, --btn-opacity, .lefty, .placed) */
      #hud { --btn-scale: 1; --btn-opacity: 1; }
      #btnAtk, #btnDodge { opacity: var(--btn-opacity); }
      #btnAtk {
        width: calc(88px * var(--btn-scale)); height: calc(88px * var(--btn-scale)); font-size: calc(20px * var(--btn-scale));
        right: calc(22px + var(--sar)); bottom: calc(26px + var(--sab));
      }
      #btnDodge {
        width: calc(64px * var(--btn-scale)); height: calc(64px * var(--btn-scale)); font-size: calc(15px * var(--btn-scale));
        right: calc(22px + 100px * var(--btn-scale) + var(--sar)); bottom: calc(18px + var(--sab));
      }
      #hud.lefty #btnAtk { right: auto; left: calc(22px + var(--sal)); }
      #hud.lefty #btnDodge { right: auto; left: calc(22px + 100px * var(--btn-scale) + var(--sal)); }
      #hud .btn.placed { right: auto; bottom: auto; transform: translate(-50%, -50%); }
      #btnDodge.cd { opacity: calc(var(--btn-opacity) * 0.4); }
      #hud.editing .btn { outline: 2px dashed var(--gold); outline-offset: 4px; opacity: 1; }
      #btnSettings {
        width: 40px; height: 40px; font-size: 20px; right: calc(12px + var(--sar)); top: calc(62px + var(--sat));
      }
      #hud.editing #btnSettings { display: none; }
      #editBar {
        position: fixed; top: calc(12px + var(--sat)); left: 50%; transform: translateX(-50%); display: none;
        align-items: center; gap: 12px; padding: 8px 10px 8px 16px; border-radius: 12px; font-weight: 700; font-size: 14px;
        background: rgba(12, 10, 18, 0.88); border: 1px solid rgba(242, 211, 138, 0.5); white-space: nowrap;
      }
      #editBar.show { display: flex; }
      #editBar button { font: inherit; font-weight: 800; color: #1b1408; background: var(--gold); border: 0; border-radius: 8px; padding: 8px 16px; }

      /* 두루마리 설정창: 위에서 내려오며 종이가 펼쳐진다 */
      #settings {
        position: fixed; inset: 0; display: flex; justify-content: center; align-items: flex-start;
        background: rgba(6, 5, 10, 0); pointer-events: none; transition: background 0.4s; overflow: hidden;
      }
      #settings.open { background: rgba(6, 5, 10, 0.6); pointer-events: auto; }
      .scroll {
        width: min(86vw, 400px); margin-top: calc(10px + var(--sat)); color: #3b2a14;
        transform: translateY(-140%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      #settings.open .scroll { transform: translateY(0); }
      .rod {
        position: relative; height: 22px; margin: 0 -14px; border-radius: 11px; z-index: 1;
        background: linear-gradient(#a8743c, #6b4420 55%, #4a2d12); box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5);
      }
      .rod::before, .rod::after {
        content: ""; position: absolute; top: -3px; width: 14px; height: 28px; border-radius: 6px;
        background: linear-gradient(#d9b25a, #8f6a22);
      }
      .rod::before { left: -4px; }
      .rod::after { right: -4px; }
      .paper {
        display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.55s ease 0.25s; margin: -4px 0;
        background: linear-gradient(90deg, #cdb078, #ecd9a6 12%, #f1e2b6 50%, #ecd9a6 88%, #cdb078);
        box-shadow: inset 0 0 24px rgba(120, 80, 30, 0.35);
      }
      #settings.open .paper { grid-template-rows: 1fr; }
      .paper > div { overflow: hidden; min-height: 0; }
      .paper .inner { padding: 14px 20px 16px; max-height: calc(100vh - 90px - var(--sat) - var(--sab)); overflow-y: auto; }
      .paper h2 { margin: 0 0 10px; text-align: center; font-size: 20px; letter-spacing: 0.3em; text-indent: 0.3em; }
      .opt { margin: 10px 0; font-weight: 700; font-size: 14px; }
      .opt label { display: flex; justify-content: space-between; margin-bottom: 4px; }
      .opt input[type="range"] { width: 100%; accent-color: #7a4a1c; height: 26px; margin: 0; }
      .row { display: flex; gap: 8px; }
      .paper button {
        flex: 1; font: inherit; font-weight: 800; font-size: 14px; color: #3b2a14; padding: 10px 6px; border-radius: 8px;
        background: rgba(122, 74, 28, 0.12); border: 1.5px solid #7a4a1c; touch-action: manipulation;
      }
      .paper button.on, .paper button.primary { background: #7a4a1c; color: #f6e9c4; }
      /* 가로로 눕힌 휴대폰처럼 높이가 낮으면 두 단으로 나눠 한 화면에 다 보이게 한다 */
      @media (max-height: 520px) {
        .scroll { width: min(90vw, 620px); }
        .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
        .paper .inner { padding: 10px 22px 12px; }
        .paper h2 { margin-bottom: 4px; }
        .opt { margin: 7px 0; }
      }
      .paper .hint { font-weight: 500; font-size: 12px; opacity: 0.8; margin-top: 4px; }
      #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
      #fade.on { opacity: 1; }
      .screen {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; text-align: center; padding: 24px;
        background: radial-gradient(rgba(30, 22, 44, 0.82), rgba(6, 5, 10, 0.96));
      }
      .screen.hidden { display: none; }
      .screen h1 { margin: 0; font-size: clamp(34px, 9vw, 64px); letter-spacing: 0.12em; color: var(--gold); text-shadow: 0 3px 12px #000; }
      .screen p { margin: 0; color: #cfc6b4; line-height: 1.6; font-size: 14px; }
      .screen button {
        touch-action: manipulation;
        margin-top: 8px; font: inherit; font-weight: 800; font-size: 18px; color: #1b1408; background: var(--gold);
        border: 0; border-radius: 12px; padding: 14px 38px;
      }
      @media (hover: hover) and (pointer: fine) { #btnAtk, #btnDodge { opacity: 0.55; } }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="top">
        <div>
          <div class="bar" id="hpbar"><div id="hpfill"></div><div id="hptext"></div></div>
          <div id="items"></div>
        </div>
        <div id="floor"></div>
      </div>
      <div id="boss"><div id="bossname"></div><div class="bar"><div id="bossfill"></div></div></div>
      <div id="hurt"></div>
      <div id="dmg"></div>
      <div id="toast"></div>
      <div id="stick"><div id="knob"></div></div>
      <button class="btn" id="btnDodge">구르기</button>
      <button class="btn" id="btnAtk">공격</button>
      <button class="btn" id="btnSettings" aria-label="설정">⚙</button>
    </div>
    <div id="editBar" class="ui"><span>버튼을 끌어 원하는 곳에 놓으세요</span><button id="editDone">완료</button></div>
    <div id="settings" class="ui">
      <div class="scroll">
        <div class="rod"></div>
        <div class="paper"><div><div class="inner">
          <h2>설정</h2>
          <div class="cols"><div>
          <div class="opt">
            <label><span>버튼 크기</span><span id="valScale"></span></label>
            <input type="range" id="optScale" min="60" max="160" step="5" />
          </div>
          <div class="opt">
            <label><span>버튼 투명도</span><span id="valOpacity"></span></label>
            <input type="range" id="optOpacity" min="20" max="100" step="5" />
          </div>
          </div><div>
          <div class="opt">
            <label><span>버튼 배치</span></label>
            <div class="row"><button id="optRight">오른손</button><button id="optLeft">왼손</button></div>
            <div class="hint">왼손: 버튼은 왼쪽, 이동 조작은 화면 오른쪽</div>
          </div>
          <div class="opt">
            <div class="row"><button id="optEdit">버튼 직접 배치</button><button id="optReset">초기화</button></div>
          </div>
          <div class="opt"><div class="row"><button id="setClose" class="primary">닫기</button></div></div>
          </div></div>
        </div></div></div>
        <div class="rod"></div>
      </div>
    </div>
    <div id="fade"></div>
    <div id="menu" class="screen">
      <h1>THE TOWER</h1>
      <p>방의 몬스터를 처치하고, 아이템을 모아 탑의 끝까지 오르세요.</p>
      <p>
        모바일: 화면 왼쪽 드래그로 이동 · 오른쪽 드래그로 시점(상하좌우) · 공격 / 구르기 버튼<br />
        PC: WASD 이동 · J/Space 공격 · K/Shift 구르기 · 마우스 드래그(상하좌우) 시점 · 휠 거리
      </p>
      <p id="best"></p>
      <button id="start">탑 오르기</button>
    </div>
    <div id="dead" class="screen hidden">
      <h1>쓰러졌습니다</h1>
      <p id="result"></p>
      <button id="retry">다시 도전</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
